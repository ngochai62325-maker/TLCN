# Opt-in only. Do not apply until the owner approves the Airflow canary.
# Requires the verified cp310 dependency directory prepared in .pytest_cache.
# Inject the existing Airflow ingestion DB secret; never store it in this file.
services:
  spark-iceberg:
    environment:
      PYTHONPATH: /opt/silver-release-deps:/home/iceberg/src:/home/iceberg/jobs:/home/iceberg/jobs/silver
      INGESTION_DB_URL: ${SILVER_INGESTION_DB_URL:?Inject the existing Airflow ingestion DB URL}
    volumes:
      - ./.pytest_cache/silver_release_deps_cp310:/opt/silver-release-deps:ro
      - ./config/ingestion:/home/iceberg/config/ingestion:ro
  airflow-scheduler:
    environment:
      SILVER_ACCEPTED_RELEASE: silver_v2_release_20261013
      SILVER_CANARY_ONLY: "1"
      _PIP_ADDITIONAL_REQUIREMENTS: openpyxl==3.1.5 pyiceberg==0.12.0
  airflow-webserver:
    environment:
      SILVER_ACCEPTED_RELEASE: silver_v2_release_20261013
      SILVER_CANARY_ONLY: "1"
      _PIP_ADDITIONAL_REQUIREMENTS: openpyxl==3.1.5 pyiceberg==0.12.0
