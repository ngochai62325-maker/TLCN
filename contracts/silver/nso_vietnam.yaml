normalization:
  country: UN M49 704; national label exact, no province code inference
  province: Exact source-table/raw-label/full-year interval mapping; unapproved entries
    ignored
  commodity: Rice
  date: Reference year from exact period token; provisional retained separately
  unit: V06.12 quantity x1000; index percent x1; matrix proposal only until approved
  numeric: decimal(28,8); missing NULL never 0
data_quality:
- rule_id: NSO_SOURCE_COLUMN
  sql_expr: _column_present
  failed_column: source_column
  rule: Only actual source-header columns become observations
  severity: ERROR
  action: QUARANTINE
deduplication:
  key: *id001
  strategy: latest ingestion timestamp; deterministic source-file/payload tie
  survivorship: Existing shared merge stale guard; source_table remains key
  duplicate_action: Deterministic survivor; report input/dedup difference
quarantine:
  conditions:
  - NSO_DATE
  - NSO_GEOGRAPHY
  - NSO_UNIT
  - NSO_VALUE
  - CONTRACT_CAST
  - CONTRACT_REQUIRED
  - LINEAGE_REQUIRED
  required_fields:
  - quarantine_record_id
  - source_dataset
  - pipeline_run_id
  - detected_at
  - business_key_hash
  - errors
  - payload
  target: iceberg.silver.dead_letters
  excluded_record_dataset: nso_vietnam_exclusions
metadata:
  propagated_columns:
  - _source_payload
  - _ingestion_run_id
  - _ingestion_batch_id
  - _ingestion_chunk_id
  - _ingestion_timestamp
  - _source_id
  - _source_file
  - _source_checksum
  - _source_snapshot_id
  - _bronze_iceberg_snapshot_id
  source_snapshot_reference: _source_snapshot_id=0 is preserved with LINEAGE_REFERENCE
    WARNING; NOT Iceberg snapshot
incremental:
  strategy: Existing ingestion watermark/run ID filtering and common Iceberg MERGE
  change_detection: Source payload + business key; actual read snapshot excluded from
    payload identity
  late_arriving_data: Older ingestion cannot overwrite newer valid observation; changed
    checksum/metadata reconciled
gold_dependency:
  target_domain: rice statistics
  status: BLOCKED
  eligibility: gold_ready=false throughout E1; explicit approved historical mappings
    and units required
