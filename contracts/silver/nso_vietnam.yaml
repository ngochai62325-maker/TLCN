dataset:
  name: NSO Vietnam - V06 Rice Statistics
  source_id: nso_vietnam
  source_system: GSO_Vietnam
  bronze_input: iceberg.bronze.nso_vietnam
  silver_output: iceberg.silver.nso_rice_statistics
contract_status: READY
grain:
  description: Source table x exact raw geography x year x season x measure x statistic
    kind
  business_key: &id001
  - source_table
  - geography_name_raw
  - year
  - season
  - measure
  - statistic_kind
schema:
  columns:
  - name: source_table
    source_column: source_table
    data_type: string
    nullable: false
  - name: source_column
    source_column: source_column
    data_type: string
    nullable: false
  - name: geography_name_raw
    source_column: geography_name_raw
    data_type: string
    nullable: false
    preserve_whitespace: true
  - name: geography_level
    source_column: geography_level
    data_type: string
    nullable: false
  - name: geography_name
    source_column: geography_name
    data_type: string
    nullable: true
    description: Exact candidate name with restored accents; historical code mapping still needs review
  - name: geography_code
    source_column: geography_code
    data_type: string
    nullable: true
  - name: mapping_status
    source_column: mapping_status
    data_type: string
    nullable: false
  - name: country_code
    source_column: country_code
    data_type: string
    nullable: false
  - name: province_code
    source_column: province_code
    data_type: string
    nullable: true
  - name: commodity_name
    source_column: commodity_name
    data_type: string
    nullable: false
  - name: period_raw
    source_column: period_raw
    data_type: string
    nullable: false
    preserve_whitespace: true
  - name: year
    source_column: year
    data_type: integer
    nullable: false
  - name: period_valid
    source_column: period_valid
    data_type: boolean
    nullable: false
  - name: is_provisional
    source_column: is_provisional
    data_type: boolean
    nullable: false
  - name: season
    source_column: season
    data_type: string
    nullable: false
  - name: measure
    source_column: measure
    data_type: string
    nullable: false
  - name: statistic_raw
    source_column: statistic_raw
    data_type: string
    nullable: false
    preserve_whitespace: true
  - name: statistic_kind
    source_column: statistic_kind
    data_type: string
    nullable: false
  - name: source_unit
    source_column: source_unit
    data_type: string
    nullable: false
  - name: unit
    source_column: unit
    data_type: string
    nullable: false
  - name: conversion_factor
    source_column: conversion_factor
    data_type: decimal(18,6)
    nullable: false
  - name: unit_source_reference
    source_column: unit_source_reference
    data_type: string
    nullable: false
  - name: value_raw
    source_column: value_raw
    data_type: string
    nullable: true
    preserve_whitespace: true
  - name: value_source
    source_column: value_source
    data_type: decimal(28,8)
    nullable: true
  - name: value
    source_column: value
    data_type: decimal(28,8)
    nullable: true
  - name: is_missing
    source_column: is_missing
    data_type: boolean
    nullable: false
  - name: missing_kind
    source_column: missing_kind
    data_type: string
    nullable: false
data_quality:
- rule_id: NSO_YEAR
  sql_expr: period_valid AND year BETWEEN 1960 AND year(current_date()) + 1
  failed_column: year
  action: QUARANTINE
  rule: NSO_YEAR
  severity: ERROR
- rule_id: NSO_KIND
  sql_expr: statistic_kind IN ('quantity','development_index')
  failed_column: statistic_kind
  action: QUARANTINE
  rule: NSO_KIND
  severity: ERROR
- rule_id: NSO_MISSING
  sql_expr: is_missing = (missing_kind <> 'present') AND (NOT is_missing OR (value_source
    IS NULL AND value IS NULL))
  failed_column: value
  action: QUARANTINE
  rule: NSO_MISSING
  severity: ERROR
- rule_id: NSO_NUMBER
  sql_expr: (is_missing OR (value_source IS NOT NULL AND value IS NOT NULL)) AND (value_source
    IS NULL OR value_source >= 0) AND (value IS NULL OR value >= 0)
  failed_column: value
  action: QUARANTINE
  rule: NSO_NUMBER
  severity: ERROR
- rule_id: NSO_UNIT
  sql_expr: (statistic_kind = 'development_index' AND unit = 'percent' AND source_unit
    = 'percent' AND conversion_factor = 1) OR (statistic_kind = 'quantity' AND ((measure
    = 'area' AND source_unit = '1000 hectare' AND unit = 'hectare' AND conversion_factor
    = 1000) OR (measure = 'yield' AND source_unit = 'quintal/hectare' AND unit = 'kg/hectare'
    AND conversion_factor = 100) OR (measure = 'production' AND source_unit = '1000
    tonne' AND unit = 'tonne' AND conversion_factor = 1000)))
  failed_column: unit
  action: QUARANTINE
  rule: NSO_UNIT
  severity: ERROR
- rule_id: NSO_CONVERSION
  sql_expr: is_missing OR value = try_cast(try_multiply(value_source, conversion_factor)
    AS decimal(28,8))
  failed_column: value
  action: QUARANTINE
  rule: NSO_CONVERSION
  severity: ERROR
- rule_id: NSO_GEOGRAPHY_MAPPING
  sql_expr: (mapping_status = 'verified' AND geography_level = 'national' AND geography_code
    = '704') OR (mapping_status = 'needs_review' AND geography_code IS NULL AND province_code
    IS NULL)
  failed_column: mapping_status
  action: QUARANTINE
  rule: NSO_GEOGRAPHY_MAPPING
  severity: ERROR
- rule_id: NSO_GEOGRAPHY_WARNING
  sql_expr: mapping_status = 'verified'
  failed_column: geography_name_raw
  action: LOG
  rule: NSO_GEOGRAPHY_WARNING
  severity: WARNING
deduplication:
  key: *id001
  strategy: latest_ingestion_timestamp
  survivorship: latest timestamp/file then deterministic values
storage:
  partition_columns:
  - year
  format_version: 2
  compression: zstd
quarantine:
  required_fields: *id001
  exclusions_source: nso_vietnam_exclusions
incremental:
  strategy: bronze_run_id_or_watermark
  late_arriving_data: freshness guarded upsert
normalization:
  geography: Preserve exact raw label; restore a separate name by exact candidate lookup;
    keep unverified geographic codes NULL and review warnings
  unit: Verified against official NSO Statistical Yearbook 2018 and V06.12 headers
  missing: Retain missing observations; audit all-source-NULL records without unpivoting
gold_dependency:
  target_domain: rice_statistics
  restriction: Do not aggregate across source tables/geography levels/seasons/statistic
    kinds; geographic joins require reviewed mapping
