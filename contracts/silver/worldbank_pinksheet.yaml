dataset:
  name: "World Bank - Commodity Markets Pink Sheet (Silver)"
  source_id: "worldbank_pinksheet"
  source_system: "WorldBank"
  bronze_input: "iceberg.bronze.worldbank_pinksheet"
  silver_output: "iceberg.silver.worldbank_commodity_monthly"

contract_status: READY

grain:
  description: "One record represents the monthly benchmark price for a specific commodity in a specific month."
  business_key:
    - "commodity_code"
    - "period_date"

schema:
  columns:
    - name: "commodity_code"
      source_column: "commodity_code"
      data_type: "string"
      nullable: false
      description: "Standardized commodity identifier (e.g., rice_thai_5, rice_viet_namese_5, maize, wheat)"
      transformation: "derived from wide column names, trimmed and lowercased"
    - name: "commodity_name"
      source_column: "commodity_name"
      data_type: "string"
      nullable: false
      description: "Human-readable commodity description"
      transformation: "mapped from commodity code dictionary"
    - name: "period_code"
      source_column: "period"
      data_type: "string"
      nullable: false
      description: "Source period string (e.g., 2024M08)"
      transformation: "cast to string, trim"
    - name: "period_date"
      source_column: "period_date"
      data_type: "date"
      nullable: false
      description: "First day of the reference month (e.g., 2024-08-01)"
      transformation: "parsed from period (YYYYMmm -> YYYY-MM-01)"
    - name: "year"
      source_column: "year"
      data_type: "integer"
      nullable: false
      description: "Calendar year"
      transformation: "extracted from period (YYYY as int)"
    - name: "month"
      source_column: "month"
      data_type: "integer"
      nullable: false
      description: "Calendar month (1-12)"
      transformation: "extracted from period (mm as int)"
    - name: "price"
      source_column: "price"
      data_type: "decimal(18,2)"
      nullable: true
      description: "Monthly commodity benchmark price"
      transformation: "cast to decimal, strip non-numeric indicators ('…') to null"
    - name: "unit"
      source_column: "unit"
      data_type: "string"
      nullable: true
      description: "Unit of price measurement (e.g., $/mt, $/kg, $/bbl)"
      transformation: "parsed from column suffix or dictionary"
    - name: "series_name"
      source_column: "series_name"
      data_type: "string"
      nullable: true
      description: "World Bank series description"
      transformation: "mapped from Pink Sheet metadata"

normalization:
  commodity: "Standardize commodity codes and descriptions across all commodities (focus on rice varieties and grain substitutes)."
  date: "Standard ISO-8601 date (YYYY-MM-01) for period_date."
  unit: "Standardize $/mt to USD/tonne, $/kg to USD/kg, $/bbl to USD/barrel."
  numeric: "Invalid/missing tokens such as '…' or empty strings converted to NULL."

data_quality:
  - rule_id: "WB_DQ_001"
    rule: "commodity_code and period_date cannot be null"
    dimension: "Completeness"
    severity: "ERROR"
    action: "QUARANTINE"
  - rule_id: "WB_DQ_002"
    rule: "month must be between 1 and 12, year between 1960 and 2050"
    dimension: "Validity"
    severity: "ERROR"
    action: "QUARANTINE"
  - rule_id: "WB_DQ_003"
    rule: "price must be positive (> 0) if not null"
    dimension: "Validity"
    severity: "WARNING"
    action: "LOG"

deduplication:
  key:
    - "commodity_code"
    - "period_date"
  strategy: "Timestamp-based survivorship"
  survivorship: "Keep record with most recent _ingestion_timestamp"
  duplicate_action: "Overwrite in Silver"

quarantine:
  conditions:
    - "Fails DQ rules with severity ERROR"
  required_fields:
    - "quarantine_record_id"
    - "source_system"
    - "dataset"
    - "failed_column"
    - "error_message"
    - "ingestion_run_id"

metadata:
  propagated_columns:
    - "_ingestion_run_id"
    - "_source_file"
    - "_source_checksum"
    - "_source_snapshot_id"
    - "_ingestion_timestamp"

incremental:
  strategy: "MERGE"
  change_detection: "Business key match (commodity_code, period_date)"
  late_arriving_data: "UPSERT pattern using MERGE"

gold_dependency:
  target_domain: "Global Commodity Pricing Benchmarks, Inflation and Market Trends"
