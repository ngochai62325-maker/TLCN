# Phase 2 controlled local Airflow test. Combine with compose.silver-test.yml.
# Use a NEW -p project. Never combine with docker-compose.yml/shared volumes.
x-local-env: &local-env
  SILVER_LOCAL_PROFILE: local_nine
  SILVER_LOCAL_ENABLED: "1"
  SILVER_ACCEPTED_RELEASE: ""
  SILVER_PRODUCTION_ENABLED: "0"
  SILVER_CANARY_ONLY: "0"
  SILVER_BRONZE_SCHEDULE: ""
  PYTHONPATH: /workspace/src:/workspace/jobs/silver:/workspace
  INGESTION_DB_URL: postgresql://rebuild_test:rebuild-test-only-password@postgres-test:5432/silver_rebuild_test
  MINIO_ENDPOINT: minio-test:9000
  MINIO_ROOT_USER: rebuild_test
  MINIO_ROOT_PASSWORD: rebuild-test-only-password
  AWS_ACCESS_KEY_ID: rebuild_test
  AWS_SECRET_ACCESS_KEY: rebuild-test-only-password
  AWS_REGION: us-east-1
  ICEBERG_REST_URI: http://rest-test:8181
  TRINO_HOST: trino-test
  TRINO_PORT: "8080"
  SPARK_API_URL: http://runner:5005/run

x-airflow: &airflow
  image: tlcn/silver-airflow@sha256:6748e6464ed7231f5ff35bf6fe10c6e0929dc2016b9687b28c5056b85ed4cb96
  working_dir: /workspace
  environment: &airflow-env
    <<: *local-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rebuild_test:rebuild-test-only-password@postgres-test:5432/silver_rebuild_test
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /workspace/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__SECRET_KEY: isolated-local-nine-test-only
    AIRFLOW__OPENLINEAGE__DISABLED: "True"
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - .:/workspace:ro
    - ${SILVER_TEST_RAW_ROOT:?Set complete Raw path}:/workspace/data/raw:ro
    - local_airflow_logs:/opt/airflow/logs

services:
  minio-test:
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    tmpfs: !reset []
    mem_limit: 512m
    volumes: [local_minio_data:/data]
  postgres-test:
    image: postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    tmpfs: !reset []
    volumes: [local_postgres_data:/var/lib/postgresql/data]
  rest-test:
    image: tabulario/iceberg-rest@sha256:312ec6f6d3cbb7e610c1c918eee1e642d20bd8694f285823ae423025b65d4e51
    user: root
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_URI: jdbc:sqlite:/data/catalog/local-nine.db
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:ActiveProcessorCount=2
    volumes: [local_catalog_data:/data/catalog]
  trino-test:
    image: trinodb/trino@sha256:94703aecb56dd0ee138aa45e49efa9a9f23e4af54134c83a6631aa629fea16f3
    ports: [127.0.0.1:18080:8080]
    command:
      - |
        printf '%s\n' 'connector.name=iceberg' 'iceberg.catalog.type=rest' 'iceberg.rest-catalog.uri=http://rest-test:8181' 'iceberg.rest-catalog.warehouse=s3://warehouse' 'fs.native-s3.enabled=true' 's3.endpoint=http://minio-test:9000' 's3.region=us-east-1' 's3.aws-access-key=rebuild_test' 's3.aws-secret-key=rebuild-test-only-password' 's3.path-style-access=true' > /etc/trino/catalog/iceberg.properties
        printf '%s\n' 'coordinator=true' 'node-scheduler.include-coordinator=true' 'http-server.http.port=8080' 'query.max-memory=128MB' 'query.max-total-memory=256MB' 'memory.heap-headroom-per-node=256MB' 'task.concurrency=2' 'task.max-worker-threads=4' 'task.min-drivers=4' 'discovery.uri=http://localhost:8080' > /etc/trino/config.properties
        printf '%s\n' '-server' '-Xmx512M' '-XX:ActiveProcessorCount=2' '-XX:+UseG1GC' '-XX:+ExitOnOutOfMemoryError' '-Djdk.attach.allowAttachSelf=true' > /etc/trino/jvm.config
        exec /usr/lib/trino/bin/run-trino
  runner:
    image: tlcn/silver-spark@sha256:79723a677138a36a03d195d82564c5e9039abeb0a2e149b7dd89d8b289403843
    profiles: !reset []
    cpus: 2
    environment:
      <<: *local-env
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SILVER_SHUFFLE_PARTITIONS: "2"
    volumes:
      - ${SILVER_TEST_RAW_ROOT:?Set complete Raw path}:/workspace/data/raw:ro
    entrypoint: [python3]
    command: [/workspace/jobs/silver/spark_api_server.py]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow-init:
    <<: *airflow
    mem_limit: 768m
    cpus: 1
    depends_on:
      postgres-test: {condition: service_healthy}
      minio-test: {condition: service_healthy}
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        python -c "from ingestion.storage.minio_storage import MinioStorage; MinioStorage().ensure_bucket('warehouse')"
        airflow users create --username local_nine --password local-nine-test-only --firstname Local --lastname Demo --role Admin --email local@example.invalid
  airflow-scheduler:
    <<: *airflow
    mem_limit: 1536m
    cpus: 2
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      runner: {condition: service_healthy}
  airflow-webserver:
    <<: *airflow
    mem_limit: 1024m
    cpus: 1
    ports: [127.0.0.1:18085:8080]
    command: webserver
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  local_minio_data:
  local_postgres_data:
  local_catalog_data:
  local_airflow_logs:
