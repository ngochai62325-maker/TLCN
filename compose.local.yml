# Portable local entrypoint. Combine in this order:
# compose.silver-test.yml, compose.local-nine-test.yml, compose.local.yml
# Canonical fresh local demo (project tlcn-local). Never apply to accepted projects.
x-local-airflow-image: &local-airflow-image
  image: ${TLCN_AIRFLOW_IMAGE:-tlcn/silver-airflow:local}
  build:
    context: .
    dockerfile: docker/silver-airflow.Dockerfile

services:
  runner:
    image: ${TLCN_SPARK_IMAGE:-tlcn/silver-spark:local}
    build:
      context: .
      dockerfile: docker/silver-spark.Dockerfile
  airflow-init:
    <<: *local-airflow-image
  airflow-webserver:
    <<: *local-airflow-image
    ports: !override
      - 127.0.0.1:8085:8080
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/health',timeout=5)); assert d['metadatabase']['status']=='healthy' and d['scheduler']['status']=='healthy'"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
  airflow-scheduler:
    <<: *local-airflow-image
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
  trino-test:
    ports: !override
      - 127.0.0.1:${TLCN_TRINO_PORT:-18080}:8080

# The test base deliberately uses an internal network. Docker does not publish
# the requested localhost ports on this host when it is the only network.
# Use an ordinary project-scoped bridge; only UI/Trino publish host ports.
networks:
  default:
    driver: bridge
    internal: false
