# INACTIVE preparation artifact. Not part of the default compose invocation.
# Build images separately and inject their immutable sha256 IDs (or published digests).
# Keep activation OFF/manual-only until the owner approves a deployment and schedule.
services:
  spark-iceberg:
    image: ${SILVER_SPARK_IMAGE:?Inject the verified immutable Spark image reference}
    environment:
      PYTHONPATH: /home/iceberg/src:/home/iceberg/jobs:/home/iceberg/jobs/silver
      INGESTION_DB_URL: ${SILVER_INGESTION_DB_URL:?Inject the existing ingestion DB secret}
    volumes:
      - ./config/ingestion:/home/iceberg/config/ingestion:ro
  airflow-scheduler:
    image: ${SILVER_AIRFLOW_IMAGE:?Inject the verified immutable Airflow image reference}
    environment:
      SILVER_ACCEPTED_RELEASE: silver_v2_release_20261013
      SILVER_PRODUCTION_ENABLED: ${SILVER_PRODUCTION_ENABLED:-0}
      SILVER_CANARY_ONLY: ${SILVER_CANARY_ONLY:-1}
      SILVER_BRONZE_SCHEDULE: ${SILVER_BRONZE_SCHEDULE:-}
      INGESTION_DB_URL: ${SILVER_INGESTION_DB_URL:?Inject the existing ingestion DB secret}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${SILVER_AIRFLOW_DB_URL:?Inject the existing Airflow metadata DB secret}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes:
      - ./config/ingestion:/opt/airflow/config/ingestion:ro
  airflow-webserver:
    image: ${SILVER_AIRFLOW_IMAGE:?Inject the verified immutable Airflow image reference}
    environment:
      SILVER_ACCEPTED_RELEASE: silver_v2_release_20261013
      SILVER_PRODUCTION_ENABLED: ${SILVER_PRODUCTION_ENABLED:-0}
      SILVER_CANARY_ONLY: ${SILVER_CANARY_ONLY:-1}
      SILVER_BRONZE_SCHEDULE: ${SILVER_BRONZE_SCHEDULE:-}
      INGESTION_DB_URL: ${SILVER_INGESTION_DB_URL:?Inject the existing ingestion DB secret}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${SILVER_AIRFLOW_DB_URL:?Inject the existing Airflow metadata DB secret}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes:
      - ./config/ingestion:/opt/airflow/config/ingestion:ro
