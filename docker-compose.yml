services:
  # -------------------------------------------------------------
  # Storage Layer: MinIO (S3 compatible object storage)
  # -------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MinIO Bucket Initializer: Auto-create bronze, silver, gold, warehouse
  # -------------------------------------------------------------
  mc-init:
    image: quay.io/minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123};
      /usr/bin/mc mb --ignore-existing minio/bronze;
      /usr/bin/mc mb --ignore-existing minio/silver;
      /usr/bin/mc mb --ignore-existing minio/gold;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      echo 'MinIO Lakehouse buckets (bronze, silver, gold, warehouse) successfully initialized!';
      exit 0;
      "

  # -------------------------------------------------------------
  # Catalog Layer: Apache Iceberg REST Catalog
  # -------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:0.8.0
    container_name: iceberg-rest
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-admin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: us-east-1
      CATALOG_URI: "jdbc:sqlite:/data/catalog/iceberg_rest.db?journal_mode=WAL&busy_timeout=60000"
    volumes:
      - ./data/catalog:/data/catalog
    depends_on:
      mc-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-net

  # -------------------------------------------------------------
  # Query Engine: Trino
  # -------------------------------------------------------------
  trino:
    image: trinodb/trino:448
    container_name: trino
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./config/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./config/trino/etc/config.properties:/etc/trino/config.properties
      - ./config/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      - iceberg-rest
      - minio
    networks:
      - lakehouse-net

  # -------------------------------------------------------------
  # Processing Engine: Apache Spark with Iceberg Runtime & Jupyter
  # -------------------------------------------------------------
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: spark-iceberg
    ports:
      - "8888:8888" # Jupyter Lab UI
      - "8081:8080" # Spark UI
      - "7077:7077" # Spark Master port
      - "4040:4040" # Spark Driver Web UI
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: us-east-1
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data:/home/iceberg/data
      - ./jobs:/home/iceberg/jobs
      - ./notebooks:/home/iceberg/notebooks
    depends_on:
      - iceberg-rest
      - minio
    networks:
      - lakehouse-net

  # -------------------------------------------------------------
  # Orchestration Database: PostgreSQL for Airflow Metadata
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Airflow DB Migrations & Admin User Init
  # -------------------------------------------------------------
  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.4-python3.11}
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse-net
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username $${AIRFLOW_USER:-airflow} --password $${AIRFLOW_PASSWORD:-airflow} --firstname Admin --lastname User --role Admin --email admin@lakehouse.local || true
      "

  # -------------------------------------------------------------
  # Orchestrator: Airflow Webserver
  # -------------------------------------------------------------
  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.4-python3.11}
    container_name: airflow-webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__CORE__FERNET_KEY: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: "/opt/airflow/src"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      INGESTION_DB_URL: "postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}"
      TRINO_HOST: "trino"
      TRINO_PORT: "8080"
      _PIP_ADDITIONAL_REQUIREMENTS: "openpyxl pyiceberg"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    networks:
      - lakehouse-net

  # -------------------------------------------------------------
  # Orchestrator: Airflow Scheduler
  # -------------------------------------------------------------
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.4-python3.11}
    container_name: airflow-scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: "/opt/airflow/src"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      INGESTION_DB_URL: "postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}"
      TRINO_HOST: "trino"
      TRINO_PORT: "8080"
      _PIP_ADDITIONAL_REQUIREMENTS: "openpyxl pyiceberg"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    networks:
      - lakehouse-net

volumes:
  minio_data:
  postgres_data:

networks:
  lakehouse-net:
    driver: bridge
